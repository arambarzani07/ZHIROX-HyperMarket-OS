name: ZHIROX Windows QA (no hardware)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-qa:
    name: Windows Node 24 / SQLite / portable ZIP
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Install isolated Node.js 24 runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Sorani UI design and module syntax
        run: npm run check

      - name: Run Windows-only and restore smoke tests
        run: node --test test/windows-preflight.test.mjs test/cash-recovery.test.mjs test/purchase-intent-restart-http.test.mjs test/cash-mode-restart.test.mjs test/cash-adjustments.test.mjs test/cash-adjustments-http.test.mjs test/cash-adjustments-recovery.test.mjs test/refund-sync-readiness.test.mjs test/refund-stock-remote-contract.test.mjs test/stock-parity-qa.test.mjs test/stock-parity-cli.test.mjs test/capability-edge-qa.test.mjs

      - name: Read-only Windows peripheral inventory (no printers or devices touched)
        shell: pwsh
        run: |
          $report = & pwsh -NoProfile -File scripts/windows-device-inspect.ps1 | ConvertFrom-Json
          if (-not $report.read_only -or $report.printed_pages -ne 0 -or $report.destructive_actions -ne 0) { throw 'Unsafe peripheral inventory report' }
          if ($report.printer_tested -or $report.scanner_tested -or $report.scale_tested -or $report.cash_drawer_tested) { throw 'False physical hardware verification' }
          Write-Output "Read-only inventory succeeded. Queue count: $(@($report.printer_queues).Count); hardware unverified."

      - name: Validate scale barcode and scanner fail-closed rules
        run: node --test test/hardware-readiness.test.mjs test/receipt-print.test.mjs test/receipt-visual-qa.test.mjs

      - name: Verify read-only preflight on actual Windows runner
        run: npm run windows:preflight

      - name: Verify compatibility CMD preflight is read-only
        shell: cmd
        run: scripts\check-windows.cmd

      - name: Package committed portable source with local-only launcher
        run: npm run package:windows

      - name: Bundle SHA-256-verified upstream Node 24 x64 into QA-only portable ZIP
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/package-windows-selfcontained.ps1 -SourceZip dist/ZHIROX-Windows-Portable-0.34.0-dev.0.zip -OutputDir dist

      - name: Verify standalone Node binary and manifest inside extracted QA-only ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $matches = @(Get-ChildItem -Path 'dist/ZHIROX-Windows-SelfContained-QA-*-x64.zip')
          if ($matches.Count -ne 1) { throw 'Expected exactly one x64 self-contained QA ZIP' }
          $zip = $matches[0]
          $checksum = (Get-Content -LiteralPath "$($zip.FullName).sha256" -Raw).Split(' ')[0].Trim().ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum) { throw 'Standalone QA zip checksum mismatch' }
          $stage = Join-Path $env:RUNNER_TEMP 'zhirox-standalone-verify'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $stage -Force
          $app = Join-Path $stage 'ZHIROX-HyperMarket-OS'
          $runtime = Join-Path $app 'runtime'
          $node = Join-Path $runtime 'node.exe'
          $manifest = Get-Content -LiteralPath (Join-Path $runtime 'node-manifest.json') -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath (Join-Path $runtime 'Node-LICENSE.txt'))) { throw 'Node license absent' }
          if ($manifest.qa_only -ne $true -or $manifest.signed -ne $false -or $manifest.arch -ne 'x64') { throw 'Unsafe runtime manifest' }
          if ((Get-FileHash -LiteralPath $node -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.node_exe_sha256) { throw 'Node executable digest mismatch' }
          if ((& $node -p 'process.versions.node').Trim() -ne $manifest.version) { throw 'Wrong bundled Node version' }
          Push-Location $app
          try {
            & $node scripts/windows-preflight.mjs --strict
            if ($LASTEXITCODE -ne 0) { throw 'Bundled Node preflight failed' }
            $scanner = & $node scripts/scanner-readonly.mjs --barcode 2700002029709 | ConvertFrom-Json
            if ($scanner.item_code -ne '0000202' -or $scanner.quantity -ne $null -or $scanner.price -ne $null -or $scanner.can_post_sale) { throw 'Packaged scale decoding is unsafe' }
            $hardware = & pwsh -NoProfile -File scripts/windows-device-inspect.ps1 | ConvertFrom-Json
            if (-not $hardware.read_only -or $hardware.printed_pages -ne 0 -or $hardware.destructive_actions -ne 0) { throw 'Packaged peripheral inspector is unsafe' }
            & $node --test test/windows-preflight.test.mjs test/cash-recovery.test.mjs test/purchase-intent-restart-http.test.mjs test/cash-mode-restart.test.mjs test/cash-adjustments.test.mjs test/cash-adjustments-http.test.mjs test/cash-adjustments-recovery.test.mjs test/refund-sync-readiness.test.mjs test/refund-stock-remote-contract.test.mjs test/stock-parity-qa.test.mjs test/stock-parity-cli.test.mjs test/capability-edge-qa.test.mjs test/windows-portable-start.test.mjs test/receipt-print.test.mjs test/receipt-visual-qa.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Bundled Node recovery smoke tests failed' }
            $capture = Join-Path $env:GITHUB_WORKSPACE 'dist/receipt-visual-qa'
            & $node scripts/receipt-visual-qa.mjs $capture
            if ($LASTEXITCODE -ne 0) { throw 'Headless Windows Chrome/Edge visual receipt QA failed' }
            $audit = Get-Content -LiteralPath (Join-Path $capture 'audit.json') -Raw | ConvertFrom-Json
            if ($audit.passed -ne 3 -or $audit.printed_pages -ne 0 -or $audit.hardware_verified -ne $false) { throw 'Visual audit result invalid' }
          } finally { Pop-Location }

      - name: Verify SHA-256, ZIP contents and launch preflight from extracted package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -Path 'dist\ZHIROX-Windows-Portable-*.zip' | Select-Object -First 1
          if ($null -eq $zip) { throw 'Portable ZIP was not generated' }
          $checksum = (Get-Content -Path "$($zip.FullName).sha256" -Raw).Split(' ')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -Path $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne $actual) { throw 'Portable ZIP SHA-256 mismatch' }
          $unpack = Join-Path $env:RUNNER_TEMP 'zhirox-windows-smoke'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpack -Force
          $source = Join-Path $unpack 'ZHIROX-HyperMarket-OS'
          foreach ($f in @('Start-ZHIROX.cmd', 'scripts\windows-preflight.mjs', 'src\server.mjs')) {
            if (!(Test-Path -LiteralPath (Join-Path $source $f))) { throw "Missing packaged file: $f" }
          }
          Push-Location $source
          try {
            node scripts\windows-preflight.mjs --json --strict
            if ($LASTEXITCODE -ne 0) { throw 'Packaged preflight failed' }
            node --test test/cash-http.test.mjs test/purchase-intent-restart-http.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Extracted ZIP checkout/cash smoke tests failed' }
          } finally { Pop-Location }

      - name: Upload synthetic receipt visuals for read-only inspection
        uses: actions/upload-artifact@v4
        with:
          name: zhirox-receipt-visual-qa
          path: dist/receipt-visual-qa/
          retention-days: 7
          if-no-files-found: error

      - name: Store QA-only portable ZIP and checksum for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: zhirox-windows-qa-unsigned-portable
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error
