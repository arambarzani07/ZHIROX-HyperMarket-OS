function paintWizard(){const count=wizardChunks.length+1;q('#hs-wizard-progress').innerHTML=`<div class="wizardsteps">${Array.from({length:count},(_,i)=>`<span class="wizardstep ${i===wizardStep?'current':''} ${i<wizardStep?'done':''}"><b>${i<wizardStep?'✓':i+1}</b>${i===count-1?'پشکنینی کۆتایی':i===0?'زانیاریی سەرەکی':'وردەکاری'}</span>`).join('')}</div>`;wizardChunks.forEach((chunk,i)=>chunk.forEach(el=>el.hidden=i!==wizardStep));wizardReview=wizardStep===wizardChunks.length;q('#hs-review').hidden=!wizardReview;if(wizardReview){q('#hs-review').innerHTML=[...q('#hs-fields').querySelectorAll('label')].map(label=>{const input=label.querySelector('input,select');const heading=label.childNodes[0].textContent.trim();const value=input.type==='file'?(input.files.length?'فایل هەڵبژێردراوە':'هەڵنەبژێردراوە'):(input.value||'دیاری نەکراوە');const row=document.createElement('div');row.className='reviewrow';const a=document.createElement('span');a.textContent=heading;const b=document.createElement('strong');b.textContent=value;row.append(a,b);return row.outerHTML}).join('')+`<div class="feature" style="margin-top:12px">پشکنینی دیزاینە؛ هیچ تۆمارکردنێکی ڕاستەقینە ئەنجام نادرێت.</div>`;}q('#hs-prev').hidden=wizardStep===0;q('#hs-save').textContent=wizardReview?'تەواوکردنی پێشبینین':'دواتر';}
function openForm(title){q('#hs-modal-title').textContent=title;const specific={'کردنەوەی شەفت':['سندوق','پارەی سەرەتایی','دراو'],'ژماردنی سندوق':['پارەی ژمێردراو بە دینار','پارەی ژمێردراو بە دۆلار','تێبینی'],'داخستنی شەفت':['پارەی ژمێردراو','تێبینیی جیاوازی'],'ڕادەستکردنی سندوق':['کارمەندی وەرگر','بڕی ڕادەستکراو','تێبینی'],'پڕینتەری پسوولە':['ناوی پڕینتەر','قەبارەی کاغەز','سەردێڕی پسوولە','پەیامی کۆتایی'],'پڕینتەری لیبڵ':['ناوی پڕینتەر','پانی لیبڵ','بەرزی لیبڵ'],'سکانەر و تەرازوو':['پێشگری بارکۆد','درێژی کۆدی کاڵا','جۆری یەکە'],'دراو':['دراوی سەرەکی','نرخی ئاڵوگۆڕ'],'لق و سندوق':['ناوی لق','ناوی سندوق'],'نوێکردنەوەی خۆکار':['کاتی گونجاوی دامەزراندن','شێوازی ئاگادارکردنەوە'],'شوێنی باکئەپ':['فۆڵدەری باکئەپ','ژمارەی وەشانە پارێزراوەکان'],'گەڕاندنەوەی باکئەپ':['فایلی باکئەپ','شوێنی گەڕاندنەوە'],'هاوردەکردنی کاڵا':['فایلی CSV یان Excel','شێوازی پشکنینی بارکۆد'],'هەناردەکردنی داتا':['بەشی هەناردە','جۆری فایل'],'پسوولە ڕاگیراوەکان':['گەڕان بە ژمارەی پسوولە'],'کڕیار':['ناو یان مۆبایلی کڕیار']};const fields=title.startsWith('ڕاپۆرت:')?['لە بەرواری','بۆ بەرواری','لق','دراو']:(specific[title]||forms[current]||['ناونیشان','بەروار','تێبینی']);q('#hs-fields').innerHTML=fields.map((x,i)=>`<label>${x}${i<2?'<span class="required">پێویست</span>':''}${['دراو','دراوی سەرەکی','دراوی حساب'].includes(x)?`<select aria-label="${x}"><option>دیناری عێراقی</option><option>دۆلاری ئەمریکی</option></select>`:x==='ڕۆڵ'?`<select aria-label="${x}"><option>کاشێر</option><option>کارمەندی کۆگا</option><option>بەڕێوەبەر</option><option>خاوەن</option></select>`:`<input type="${x.includes('بەروار')?'date':x.startsWith('فایل')?'file':'text'}" placeholder="${x}" aria-label="${x}" ${i<2?'required':''}>`}</label>`).join('');wizardStep=0;wizardReview=false;const labels=[...q('#hs-fields').children];wizardChunks=[];for(let i=0;i<labels.length;i+=3)wizardChunks.push(labels.slice(i,i+3));paintWizard();q('#hs-modal').hidden=false;root.classList.add('task-open');icons();q('#hs-modal').scrollIntoView({block:'nearest',behavior:'smooth'})}
function render(key){current=key;const scopeIndex=featurePages.indexOf(key);q('#office-scope').hidden=key==='overview';q('#office-scope').open=false;q('#office-features').innerHTML=scopeIndex>=0?flattenedScopes[scopeIndex][1].map(item=>`<li>${item}</li>`).join(''):'';q('#hs-back').innerHTML=key==='overview'?'':`<button class="backbtn" data-page="overview"><i data-lucide="arrow-right"></i> هەموو بەشەکان</button>`;const group=groups.find(g=>g[3].includes(key));root.querySelectorAll('[data-group]').forEach(b=>{if(b.dataset.group===group[0])b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});q('#hs-subnav').innerHTML=group[3].length>1?group[3].map(id=>{const page=pages.find(p=>p[0]===id);return `<button data-page="${id}" aria-current="${id===key?'page':'false'}">${page[2]}</button>`}).join(''):'';const p=pages.find(x=>x[0]===key);q('#hs-category').textContent=p[3];q('#hs-title').textContent=p[2];q('#hs-description').textContent=p[4];root.classList.toggle('is-home',key==='overview');root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===key)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const create={products:'کاڵای نوێ',inventory:'ژماردنی نوێ',purchases:'پسوولەی کڕین',suppliers:'دابینکەری نوێ',customers:'کڕیاری نوێ',debt:'پارەدانەوە',expenses:'خەرجیی نوێ',team:'کارمەندی نوێ'};q('#hs-actions').innerHTML=create[key]?btn(create[key],create[key],true):'';q('#hs-modal').hidden=true;root.classList.remove('task-open');q('#hs-notice').textContent='';q('#hs-view').innerHTML=key==='overview'?dashboard():key==='pos'?pos():lists[key]?listing(key):key==='cash'?cash():key==='reports'?reports():key==='data'?data():settings();if(key==='overview'&&root.dataset.layoutMode==='full'){q('#hs-directory-content').hidden=false;q('#hs-expand').textContent='شاردنەوەی لیست ↑';q('#hs-expand').setAttribute('aria-expanded','true')}icons()}
q('#hs-nav').innerHTML=groups.map(([id,label,icon,items])=>`<button data-group="${id}"><i data-lucide="${icon}" aria-hidden="true"></i>${label}</button>`).join('');root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='hs-expand'){const content=q('#hs-directory-content');content.hidden=!content.hidden;b.setAttribute('aria-expanded',String(!content.hidden));b.textContent=content.hidden?'پیشاندانی ١٥ بەش ↓':'شاردنەوەی لیست ↑';icons();}if(b.dataset.layout){root.dataset.layoutMode=b.dataset.layout;root.querySelectorAll('[data-layout]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const content=q('#hs-directory-content');if(content){content.hidden=b.dataset.layout==='simple';const expand=q('#hs-expand');expand.setAttribute('aria-expanded',String(!content.hidden));expand.textContent=content.hidden?'پیشاندانی ١٥ بەش ↓':'شاردنەوەی لیست ↑';}}if(b.dataset.moduleFilter){const filter=b.dataset.moduleFilter;root.querySelectorAll('[data-module-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));root.querySelectorAll('[data-module]').forEach(x=>x.hidden=filter!=='all'&&x.dataset.module!==filter);}if(b.dataset.group)render(groups.find(g=>g[0]===b.dataset.group)[3][0]);if(b.dataset.quick){render(b.dataset.quick);if(['products','debt','purchases'].includes(b.dataset.quick))openForm(({products:'کاڵای نوێ',debt:'پارەدانەوە',purchases:'پسوولەی کڕین'})[b.dataset.quick])}if(b.dataset.page)render(b.dataset.page);if(b.dataset.action){if(b.dataset.action.startsWith('go:'))render(b.dataset.action.slice(3));else openForm(b.dataset.action)}if(b.dataset.filter){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));q('#hs-notice').textContent='پێشبینینی فلتەر: '+b.dataset.filter+' · هیچ داتایەکی ڕاستەقینە بار نەکراوە.'}});q('#hs-close').onclick=()=>{q('#hs-modal').hidden=true;root.classList.remove('task-open')};q('#hs-prev').onclick=()=>{if(wizardStep>0){wizardStep--;paintWizard()}};q('#hs-save').onclick=()=>{if(!wizardReview){const chunk=wizardChunks[wizardStep]||[];const invalid=chunk.flatMap(el=>[...el.querySelectorAll('input,select')]).find(x=>!x.checkValidity());if(invalid){invalid.reportValidity();return}wizardStep++;paintWizard();return}q('#hs-notice').textContent='پێشبینین تەواو بوو؛ هیچ داتایەک تۆمار نەکرا.';q('#hs-modal').hidden=true;root.classList.remove('task-open')};q('#hs-jump').addEventListener('input',()=>{const t=q('#hs-jump').value.trim();const matches=t?pages.filter(p=>(p[2]+' '+p[4]).includes(t)):[];q('#hs-results').innerHTML=matches.map(p=>`<button data-page="${p[0]}">${p[2]}<span class="sub">${p[3]}</span></button>`).join('')||(t?'<div class="sub">بەشێک نەدۆزرایەوە</div>':'');q('#hs-results').hidden=!t;});root.addEventListener('click',e=>{if(e.target.closest('[data-page]')){q('#hs-results').hidden=true;q('#hs-jump').value=''}});q('#one-theme').onclick=()=>{const currentScheme=getComputedStyle(root).colorScheme;root.style.colorScheme=currentScheme==='dark'?'light':'dark'};render('overview');})();
</script>
